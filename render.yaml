services:
  - type: web
    name: jaro-cleaning
    runtime: docker
    region: frankfurt
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_PATH
        value: ./data/jaro.db
      - key: UPLOADS_DIR
        value: ./data/uploads
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD_SHA256
        sync: false
      - key: ADMIN_SESSION_SECRET
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
